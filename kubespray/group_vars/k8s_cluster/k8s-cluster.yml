# Kubernetes cluster configuration.
# See kubespray/inventory/sample/group_vars/k8s_cluster/k8s-cluster.yml for the full reference.

# Kubernetes version — pin to a specific minor; kubespray picks the latest patch.
kube_version: v1.35.0

# Container runtime.
container_manager: containerd

# CNI plugin: calico, cilium, flannel, weave, kube-router, etc.
kube_network_plugin: cilium

# Pod and service CIDR ranges (defaults; change if they overlap with your LAN).
kube_pods_subnet: 10.233.64.0/18
kube_service_addresses: 10.233.0.0/18

# Cluster DNS domain.
cluster_name: cluster.local

# Enable metrics-server (needed for kubectl top, HPA).
metrics_server_enabled: true

# Enable CoreDNS (default, almost always wanted).
dns_mode: coredns

# kubeconfig on the control plane nodes.
kubeconfig_localhost: true
kubectl_localhost: true

# Allow scheduling on control plane (useful for small dev clusters).
# Set to false for production with dedicated workers.
kube_proxy_strict_arp: true
